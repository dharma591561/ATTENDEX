<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore WebSocket / HMR connection errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        var msg = String(event.reason && (event.reason.message || event.reason) || '');
        if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '');
        if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
          event.preventDefault();
        }
      });
    </script>
    <title>ATTENDX — College Portal</title>
    <meta name="description" content="Official college attendance and student management platform for students, faculty, and administrators." />
    <meta property="og:title" content="ATTENDX — College Portal" />
    <meta property="og:description" content="Official college attendance and student management platform for students, faculty, and administrators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
